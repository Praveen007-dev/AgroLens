name: agrolens
description: AgroLens - On-device Crop Disease & Pest Detection for Farmers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  intl: ^0.20.3
  http: ^1.2.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  path: ^1.9.0
  geolocator: ^14.1.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/models/
